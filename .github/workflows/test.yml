name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install verified restic
        shell: bash
        run: |
          python scripts/install-restic.py --dir "$RUNNER_TEMP/veyra-bin"
          echo "$RUNNER_TEMP/veyra-bin" >> "$GITHUB_PATH"
      - run: restic version
      - name: Build standalone artifact
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) target="linux-$(go env GOARCH)" ;;
            Windows) target=windows-amd64 ;;
            macOS) target="darwin-$(go env GOARCH)" ;;
          esac
          python scripts/build.py --target "$target"
      - run: python scripts/check-build.py
        env:
          VEYRA_NATIVE_SCHEDULER_TESTS: '1'
      - name: Test disposable native schedules
        if: runner.os != 'Linux'
        env:
          VEYRA_NATIVE_SCHEDULER_TESTS: '1'
        run: python scripts/test-go.py -v -run 'TestTaskSchedulerNative|TestLaunchdNative' ./internal/scheduler
      - run: python scripts/test_install.py
      - run: python scripts/test-go.py ./...
      - run: python scripts/test-go.py -race ./...
      - run: go vet ./...
      - run: go build ./cmd/veyra
      - name: Check reachable Go vulnerabilities
        if: always()
        run: python scripts/check-go-vulnerabilities.py
      - uses: actions/upload-artifact@v6
        with:
          name: veyra-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error
